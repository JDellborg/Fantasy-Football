name: FPL weekly update

on:
  # Checks every hour from 08:00 to 12:00 UTC, every day. It only publishes once a
  # gameweek is finished AND FPL has finished updating the league tables, and only
  # if that gameweek hasn't been posted yet - so it posts once per gameweek.
  schedule:
    - cron: "7 8-12 * * *"
  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = nothing public | page = web page only | test = web page + test chat (if set up) | post = web page + Teams"
        type: choice
        options: [preview, page, test, post]
        default: preview
      gameweek:
        description: "Gameweek number (leave blank for the latest finished one)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fpl-weekly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
      HAS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the update and web page
        id: build
        env:
          GAMEWEEK: ${{ inputs.gameweek }}
        run: |
          if [ "$MODE" = "scheduled" ]; then
            if [ "$HAS_WEBHOOK" != "true" ]; then
              echo "No TEAMS_WEBHOOK_URL secret yet - skipping."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            python -m fpl_weekly build --only-if-new
          elif [ -n "$GAMEWEEK" ]; then
            python -m fpl_weekly build --gameweek "$GAMEWEEK"
          else
            python -m fpl_weekly build
          fi

      - name: Save the preview files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-update
          path: out/
          if-no-files-found: ignore

      - name: Publish the web page
        if: steps.build.outputs.publish == 'true' && env.MODE != 'preview'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        if: steps.build.outputs.publish == 'true' && env.MODE != 'preview'
        uses: actions/deploy-pages@v4

      - name: Post to Teams
        if: steps.build.outputs.publish == 'true' && (env.MODE == 'post' || env.MODE == 'scheduled')
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python -m fpl_weekly post

      - name: Post to the test chat (skipped if no test chat is set up)
        if: steps.build.outputs.publish == 'true' && env.MODE == 'test'
        env:
          TEAMS_TEST_WEBHOOK_URL: ${{ secrets.TEAMS_TEST_WEBHOOK_URL }}
        run: |
          if [ -z "$TEAMS_TEST_WEBHOOK_URL" ]; then
            echo "No test chat set up (TEAMS_TEST_WEBHOOK_URL) - nothing sent to Teams."
            echo "The Teams card preview is at the top of this run's summary page."
            echo "> **Test mode:** nothing was sent to Teams (no test chat set up). The card preview is below." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m fpl_weekly post --test

      - name: Save the web page archive and posted gameweek
        if: always() && steps.build.outputs.publish == 'true' && env.MODE != 'preview'
        run: |
          git add site/ state/
          if ! git diff --cached --quiet; then
            git config user.name "fpl-weekly-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Gameweek ${{ steps.build.outputs.gameweek }} update"
            git push
          fi
