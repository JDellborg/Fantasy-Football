name: Explore FPL data (developer tool)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated API addresses to inspect"
        required: true

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect
        env:
          URLS: ${{ inputs.urls }}
        run: python scripts/explore.py $URLS
